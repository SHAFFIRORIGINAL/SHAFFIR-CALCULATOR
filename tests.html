<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eclispe Calculator Test Suite</title>
</head>
<body>
  <div id="testOutput">Initializing...</div>
  <div id="calculatorHost" style="visibility: hidden;"></div>

  <script>
    async function runTests() {
      const output = document.getElementById('testOutput');
      const results = [];
      function assert(desc, condition, details = '') {
        if (condition) {
          results.push(`[PASS] ${desc}`);
        } else {
          results.push(`[FAIL] ${desc} - ${details}`);
        }
      }

      try {
        const res = await fetch('index.html');
        const html = await res.text();
        const parser = new DOMParser();
        const parsedDoc = parser.parseFromString(html, 'text/html');

        const host = document.getElementById('calculatorHost');
        host.innerHTML = parsedDoc.querySelector('.app-header').outerHTML + parsedDoc.querySelector('.calculator-wrapper').outerHTML;

        // Load script.js
        const scriptElem = document.createElement('script');
        scriptElem.src = 'script.js';
        document.body.appendChild(scriptElem);

        // Wait for script to initialize
        await new Promise(r => setTimeout(r, 200));

        // --- 1. Branding Check ---
        const title = document.querySelector('.brand-title').textContent.trim();
        const tagline = document.querySelector('.brand-tagline').textContent.trim();
        assert('Brand Title is "Eclispe Calculator"', title === 'Eclispe Calculator', `Got: ${title}`);
        assert('Tagline is "Generated by SHAFF"', tagline === 'Generated by SHAFF', `Got: ${tagline}`);

        // --- 2. Color Theme Check ---
        const themeBtn = document.getElementById('themeToggleBtn');
        const themeLabel = document.getElementById('themeLabel');
        
        assert('Initial mode is Light', document.body.getAttribute('data-theme-setting') === 'light');
        themeBtn.click();
        assert('Cycled to Dark mode setting', document.body.getAttribute('data-theme-setting') === 'dark');
        themeBtn.click();
        assert('Cycled to System mode setting', document.body.getAttribute('data-theme-setting') === 'system');
        themeBtn.click();
        assert('Cycled back to Light mode', document.body.getAttribute('data-theme-setting') === 'light');

        // --- 3. Key Color & Styling Check ---
        const allKeys = Array.from(document.querySelectorAll('.calc-btn'));
        const delKey = document.querySelector('.btn-del');
        assert('Delete key has class btn-orange', delKey.classList.contains('btn-orange'));
        const nonDelKeys = allKeys.filter(k => !k.classList.contains('btn-del'));
        const allBlue = nonDelKeys.every(k => k.classList.contains('btn-blue'));
        assert('All calculator keys except delete are blue', allBlue);

        // --- 4. History Initial State Check ---
        const historyBtn = document.getElementById('historyToggleBtn');
        const historyDrawer = document.getElementById('historyDrawer');
        const historyBadge = document.getElementById('historyCountBadge');
        const clearHistBtn = document.getElementById('clearHistoryBtn');
        const closeHistBtn = document.getElementById('closeHistoryBtn');

        assert('History toggle button exists', !!historyBtn);
        assert('History drawer starts closed', !historyDrawer.classList.contains('open'));

        // Clear history to start clean
        clearHistBtn.click();
        assert('History badge count starts at 0', historyBadge.textContent === '0');

        // Toggle open drawer
        historyBtn.click();
        assert('Clicking History button opens drawer', historyDrawer.classList.contains('open'));

        // Close drawer with close button
        closeHistBtn.click();
        assert('Clicking Close button closes drawer', !historyDrawer.classList.contains('open'));

        // Keyboard 'h' toggles drawer
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'h' }));
        assert('Pressing "h" opens history drawer', historyDrawer.classList.contains('open'));

        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
        assert('Pressing "Escape" closes history drawer', !historyDrawer.classList.contains('open'));

        // --- 5. Calculation Adding to History ---
        const acBtn = document.querySelector('[data-action="clear"]');
        const eqBtn = document.querySelector('[data-action="calculate"]');
        const resultLine = document.getElementById('resultLine');

        function clickButton(selector) {
          const btn = document.querySelector(selector);
          if (!btn) throw new Error('Button not found: ' + selector);
          btn.click();
        }

        // Calculation 1: 50 * 2 = 100
        acBtn.click();
        clickButton('[data-insert="5"]');
        clickButton('[data-insert="0"]');
        clickButton('[data-alias="*"]');
        clickButton('[data-insert="2"]');
        eqBtn.click();
        assert('Calc 1: 50 * 2 = 100', resultLine.textContent === '100');
        assert('History badge incremented to 1', historyBadge.textContent === '1');

        // Calculation 2: 75 + 25 = 100
        acBtn.click();
        clickButton('[data-insert="7"]');
        clickButton('[data-insert="5"]');
        clickButton('[data-op="+"]');
        clickButton('[data-insert="2"]');
        clickButton('[data-insert="5"]');
        eqBtn.click();
        assert('Calc 2: 75 + 25 = 100', resultLine.textContent === '100');

        // Check history drawer list items
        const historyItems = document.querySelectorAll('.history-item');
        assert('History drawer renders items', historyItems.length >= 1);

        // Click first history item to recall
        historyItems[0].click();
        assert('Clicking history item recalls result into calculator', resultLine.textContent === '100');
        assert('Recalling closes history drawer', !historyDrawer.classList.contains('open'));

        // Test Clear History
        clearHistBtn.click();
        assert('Clear History resets badge count to 0', historyBadge.textContent === '0');
        assert('Clear History shows empty state', !!document.querySelector('.history-empty'));

      } catch (e) {
        results.push(`[FATAL ERROR] ${e.message}`);
      }

      output.innerHTML = results.map(r => `<div>${r}</div>`).join('\n');
      window.__TEST_RESULTS__ = results;
    }

    window.addEventListener('DOMContentLoaded', runTests);
  </script>
</body>
</html>
