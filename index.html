<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Eclispe Calculator - A modern scientific web calculator with Night Vision themes and safe math evaluation.">
  <title>Eclispe Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header with Brand & Theme Switcher -->
  <header class="app-header">
    <div class="brand-group">
      <h1 class="brand-title">Eclispe Calculator</h1>
      <p class="brand-tagline">Generated by SHAFF</p>
    </div>

    <!-- 3-Mode Theme Switcher (Light -> Dark -> System) -->
    <div class="theme-control">
      <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme mode" title="Cycle theme: Light, Dark, System">
        <div class="icon-slot">
          <!-- Sun Icon (Light Mode) -->
          <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>

          <!-- Moon Icon (Dark Mode) -->
          <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>

          <!-- Sun/Moon Half-and-Half Icon (System Mode) -->
          <svg class="theme-icon icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <line x1="12" y1="3" x2="12" y2="21"></line>
            <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path>
          </svg>
        </div>
        <span id="themeLabel" class="theme-mode-label">Light</span>
      </button>
    </div>
  </header>

  <!-- Calculator Main Container -->
  <main class="calculator-wrapper">
    <div class="calculator-card" role="region" aria-label="Scientific Calculator">
      
      <!-- Calculator Display -->
      <div class="display-container">
        <div class="display-top-bar">
          <button type="button" id="angleUnitBtn" class="angle-badge" aria-label="Trigonometry angle unit toggle" title="Click to toggle DEG and RAD">
            <span class="unit-deg active">DEG</span>
            <span class="unit-sep">/</span>
            <span class="unit-rad">RAD</span>
          </button>
          
          <div class="display-controls-right">
            <button type="button" id="historyToggleBtn" class="history-badge-btn" title="View Calculation History (H)" aria-label="Open calculation history">
              <svg class="history-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span>History</span>
              <span id="historyCountBadge" class="history-count-badge">0</span>
            </button>
            <div id="statusMessage" class="status-indicator">READY</div>
          </div>
        </div>
        <!-- Upper Expression Line -->
        <div id="expressionLine" class="display-expression" aria-live="polite" title="Expression"></div>
        <!-- Lower Result Line -->
        <div id="resultLine" class="display-result" aria-live="assertive" title="Current result">0</div>
      </div>

      <!-- Calculation History Drawer Overlay -->
      <div id="historyDrawer" class="history-drawer" aria-hidden="true" role="dialog" aria-label="Calculation History">
        <div class="history-header">
          <div class="history-title-group">
            <svg class="history-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <h2 class="history-title">Calculation History</h2>
          </div>
          <div class="history-actions">
            <button type="button" id="clearHistoryBtn" class="history-btn-clear" title="Clear all history">Clear</button>
            <button type="button" id="closeHistoryBtn" class="history-btn-close" aria-label="Close history drawer" title="Close (Esc)">&times;</button>
          </div>
        </div>
        <div id="historyList" class="history-list">
          <div class="history-empty">No calculations yet</div>
        </div>
        <div class="history-footer">
          <small>Click any item to reuse its result in the calculator</small>
        </div>
      </div>

      <!-- Mobile Layout Switcher Tabs (Only shown on small screens) -->
      <nav class="keypad-tabs-nav" aria-label="Keypad views">
        <button type="button" class="tab-button active" data-view="both">All</button>
        <button type="button" class="tab-button" data-view="basic">Basic (123)</button>
        <button type="button" class="tab-button" data-view="sci">Scientific (f(x))</button>
      </nav>

      <!-- Keypad Container containing Scientific and Basic Panels -->
      <div class="keypad-layout" id="keypadLayout">
        
        <!-- Scientific Panel -->
        <section class="panel-section scientific-panel" aria-label="Scientific Keys">
          <!-- Row 1: 2nd, deg/rad, sin, cos, tan -->
          <button type="button" class="calc-btn btn-blue btn-second" id="btnSecond" data-action="toggle-2nd" title="Toggle 2nd Inverse Trig Functions">2nd</button>
          <button type="button" class="calc-btn btn-blue" id="btnAngleKey" data-action="toggle-angle" title="Toggle Degrees / Radians">Rad</button>
          <button type="button" class="calc-btn btn-blue trig-btn" data-func="sin" data-inv="asin" title="Sine">sin</button>
          <button type="button" class="calc-btn btn-blue trig-btn" data-func="cos" data-inv="acos" title="Cosine">cos</button>
          <button type="button" class="calc-btn btn-blue trig-btn" data-func="tan" data-inv="atan" title="Tangent">tan</button>

          <!-- Row 2: ln, log, sqrt, x^2, x^y -->
          <button type="button" class="calc-btn btn-blue" data-func="ln" title="Natural Logarithm (ln)">ln</button>
          <button type="button" class="calc-btn btn-blue" data-func="log" title="Logarithm base 10 (log)">log</button>
          <button type="button" class="calc-btn btn-blue" data-func="sqrt" title="Square Root (&radic;)">&#8730;x</button>
          <button type="button" class="calc-btn btn-blue" data-op="^2" title="Square (x&sup2;)">x&sup2;</button>
          <button type="button" class="calc-btn btn-blue" data-op="^" title="Power (xʸ)">xʸ</button>

          <!-- Row 3: 1/x, |x|, n!, pi, e -->
          <button type="button" class="calc-btn btn-blue" data-func="recip" title="Reciprocal (1/x)">1/x</button>
          <button type="button" class="calc-btn btn-blue" data-func="abs" title="Absolute Value (|x|)">|x|</button>
          <button type="button" class="calc-btn btn-blue" data-func="fact" title="Factorial (n!)">n!</button>
          <button type="button" class="calc-btn btn-blue" data-insert="&pi;" data-alias="pi" title="Pi Constant (3.14159...)">&pi;</button>
          <button type="button" class="calc-btn btn-blue" data-insert="e" title="Euler's Constant (2.71828...)">e</button>
        </section>

        <!-- Basic Panel -->
        <section class="panel-section basic-panel" aria-label="Basic Keypad">
          <!-- Row 1: AC, ( ), %, ÷ -->
          <button type="button" class="calc-btn btn-blue btn-ac" data-action="clear" title="All Clear (Esc)">AC</button>
          <button type="button" class="calc-btn btn-blue" data-insert="(" title="Open Parenthesis">(</button>
          <button type="button" class="calc-btn btn-blue" data-insert=")" title="Close Parenthesis">)</button>
          <button type="button" class="calc-btn btn-blue" data-op="%" title="Percent (%)">%</button>
          <button type="button" class="calc-btn btn-blue btn-op" data-op="&divide;" data-alias="/" title="Divide (/)">&divide;</button>

          <!-- Row 2: 7, 8, 9, × -->
          <button type="button" class="calc-btn btn-blue btn-num" data-insert="7">7</button>
          <button type="button" class="calc-btn btn-blue btn-num" data-insert="8">8</button>
          <button type="button" class="calc-btn btn-blue btn-num" data-insert="9">9</button>
          <!-- Delete key: The ONLY orange key on the calculator -->
          <button type="button" class="calc-btn btn-orange btn-del" data-action="backspace" title="Delete / Backspace (Backspace)">&#9003; DEL</button>
          <button type="button" class="calc-btn btn-blue btn-op" data-op="&times;" data-alias="*" title="Multiply (*)"><span style="font-size: 1.15em;">&times;</span></button>

          <!-- Row 3: 4, 5, 6, − -->
          <button type="button" class="calc-btn btn-blue btn-num" data-insert="4">4</button>
          <button type="button" class="calc-btn btn-blue btn-num" data-insert="5">5</button>
          <button type="button" class="calc-btn btn-blue btn-num" data-insert="6">6</button>
          <button type="button" class="calc-btn btn-blue" data-action="negate" title="Negate / Plus-Minus (&plusmn;)">&plusmn;</button>
          <button type="button" class="calc-btn btn-blue btn-op" data-op="&minus;" data-alias="-" title="Subtract (-)"><span style="font-size: 1.2em;">&minus;</span></button>

          <!-- Row 4: 1, 2, 3, + -->
          <button type="button" class="calc-btn btn-blue btn-num" data-insert="1">1</button>
          <button type="button" class="calc-btn btn-blue btn-num" data-insert="2">2</button>
          <button type="button" class="calc-btn btn-blue btn-num" data-insert="3">3</button>
          <button type="button" class="calc-btn btn-blue btn-num" data-insert="0">0</button>
          <button type="button" class="calc-btn btn-blue btn-op" data-op="+" title="Add (+)">+</button>

          <!-- Row 5: ., = (Spanning) -->
          <button type="button" class="calc-btn btn-blue btn-num" data-insert="." title="Decimal Point">.</button>
          <button type="button" class="calc-btn btn-blue btn-equals" data-action="calculate" title="Calculate Result (Enter)">=</button>
        </section>

      </div>

      <!-- Quick Helpful Guide for Keyboard and Touch -->
      <footer class="calculator-footer">
        <span class="tip-dot"></span>
        <span class="tip-text">Full keyboard support &bull; Enter: <strong>=</strong> &bull; Backspace: <strong>DEL</strong> &bull; Esc: <strong>AC</strong></span>
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
